{% extends "base.html" %}
{% block content %}
  <h2>受保护页面</h2>
  {% if files %}
    <ul>
      {% for f in files %}
        <li>
          {% if f.is_image %}
            <a href="{{ url_for('preview', filename=f.saved_name) }}" target="_blank">
              <img class="thumb" src="{{ url_for('preview', filename=f.saved_name) }}" alt="{{ f.display_name }}" />
            </a>
          {% endif %}
          <strong>{{ f.display_name }}</strong>
          - <a href="{{ url_for('uploaded_file', filename=f.saved_name) }}">下载</a>
          <form action="{{ url_for('delete_file') }}" method="post" style="display:inline" onsubmit="return confirm('确认删除 {{ f.display_name }} ?');">
            <input type="hidden" name="filename" value="{{ f.saved_name }}" />
            <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
            <button type="submit">删除</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>当前没有上传文件。</p>
  {% endif %}
{% endblock %}
