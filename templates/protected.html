{% extends "base.html" %}
{% block content %}
  <style>
    body { max-width: 1400px; }
    .bar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    .bar .spacer { flex: 1; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid #e3e3e3; border-radius: 8px; overflow: hidden;
      background: #fff; position: relative;
      /* 屏幕外的卡片跳过渲染 —— 几千张时滚动才不掉帧 */
      content-visibility: auto; contain-intrinsic-size: 160px 205px;
    }
    .card.sel { outline: 2px solid #2f6fed; }
    .card .shot {
      width: 100%; aspect-ratio: 1 / 1; background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      cursor: zoom-in; overflow: hidden;
    }
    .card .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .shot .fb { font-size: 26px; color: #9aa0a6; cursor: default; }
    .card .meta { padding: 6px 8px; font-size: 12px; }
    .card .name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .card .sub { color: #888; display: flex; justify-content: space-between; gap: 6px; }
    .card .pick {
      position: absolute; top: 6px; left: 6px; z-index: 2;
      width: 18px; height: 18px; cursor: pointer;
    }
    .card .del {
      position: absolute; top: 6px; right: 6px; z-index: 2;
      border: 0; border-radius: 4px; background: rgba(0,0,0,.55); color: #fff;
      font-size: 12px; line-height: 1; padding: 4px 6px; cursor: pointer;
    }
    .card .del:hover { background: #c0392b; }
    .hint { color: #888; font-size: 13px; margin: 16px 0; text-align: center; }
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.88);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    #lightbox[hidden] { display: none; }
    #lightbox img { max-width: 96vw; max-height: 90vh; object-fit: contain; }
    #lightbox .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.16); border: 0; color: #fff;
      font-size: 30px; padding: 10px 14px; cursor: pointer; border-radius: 6px;
    }
    #lightbox .nav:hover { background: rgba(255,255,255,.32); }
    #lightbox .prev { left: 16px; }
    #lightbox .next { right: 16px; }
    #lightbox .close {
      position: absolute; top: 16px; right: 18px; background: transparent;
      border: 0; color: #fff; font-size: 30px; cursor: pointer;
    }
    #lightbox .cap {
      position: absolute; bottom: 18px; left: 0; right: 0;
      text-align: center; color: #ddd; font-size: 13px;
    }
  </style>

  <div class="bar">
    <strong>我的相册</strong>
    <span id="count" style="color:#888"></span>
    <span class="spacer"></span>
    <label><input type="checkbox" id="selAll" /> 全选当前页</label>
    <button id="delSel" disabled>删除选中</button>
    <a href="{{ url_for('index') }}">去上传</a>
  </div>

  <div id="grid" class="grid"></div>
  <div id="sentinel" style="height:1px"></div>
  <p id="hint" class="hint">加载中…</p>

  <div id="lightbox" hidden>
    <button class="close" aria-label="关闭">&times;</button>
    <button class="nav prev" aria-label="上一张">&#10094;</button>
    <img alt="" />
    <button class="nav next" aria-label="下一张">&#10095;</button>
    <div class="cap"></div>
  </div>

  <script>
    const CSRF = {{ csrf|tojson }};
    const PAGE_SIZE = {{ page_size|tojson }};

    const grid = document.getElementById('grid');
    const hint = document.getElementById('hint');
    const sentinel = document.getElementById('sentinel');
    const countEl = document.getElementById('count');
    const selAll = document.getElementById('selAll');
    const delSel = document.getElementById('delSel');
    const box = document.getElementById('lightbox');
    const boxImg = box.querySelector('img');
    const boxCap = box.querySelector('.cap');

    let items = [];        // 已加载的全部条目，灯箱按下标翻页
    let cursor = null;     // 游标分页，不用 OFFSET
    let loading = false;
    let done = false;
    let total = {{ total|tojson }};
    const picked = new Set();

    function human(n) {
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    function fmt(ts) {
      const d = new Date(ts * 1000);
      const p = (x) => String(x).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    function buildCard(item, index) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = item.id;

      const pick = document.createElement('input');
      pick.type = 'checkbox';
      pick.className = 'pick';
      pick.addEventListener('change', () => {
        if (pick.checked) { picked.add(item.id); card.classList.add('sel'); }
        else { picked.delete(item.id); card.classList.remove('sel'); }
        delSel.disabled = picked.size === 0;
      });

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '删除';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm('确认删除「' + item.name + '」？')) remove([item.id]);
      });

      const shot = document.createElement('div');
      shot.className = 'shot';
      if (item.thumb) {
        const img = document.createElement('img');
        img.src = '/thumb/' + item.id;
        img.alt = item.name;
        img.loading = 'lazy';        // 原生懒加载：屏幕外不发请求
        img.width = 160;
        img.height = 160;
        img.addEventListener('click', () => openBox(index));
        shot.appendChild(img);
      } else {
        const fb = document.createElement('div');
        fb.className = 'fb';
        fb.textContent = '\uD83D\uDCC4';
        shot.appendChild(fb);
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      const name = document.createElement('div');
      name.className = 'name';
      name.title = item.name;
      name.textContent = item.name;   // textContent 而非 innerHTML，防文件名 XSS
      const sub = document.createElement('div');
      sub.className = 'sub';
      const s1 = document.createElement('span');
      s1.textContent = human(item.size);
      const s2 = document.createElement('a');
      s2.href = '/download/' + item.id;
      s2.textContent = '下载';
      sub.appendChild(s1);
      sub.appendChild(s2);
      meta.appendChild(name);
      meta.appendChild(sub);

      card.appendChild(pick);
      card.appendChild(del);
      card.appendChild(shot);
      card.appendChild(meta);
      return card;
    }

    async function loadMore() {
      if (loading || done) return;
      loading = true;
      hint.textContent = '加载中…';
      let data;
      try {
        const q = '/api/files?limit=' + PAGE_SIZE + (cursor ? '&cursor=' + encodeURIComponent(cursor) : '');
        const res = await fetch(q, { headers: { 'Accept': 'application/json' } });
        if (res.status === 401) { location.href = '/login'; return; }
        data = await res.json();
      } catch (err) {
        hint.textContent = '加载失败，请刷新重试';
        loading = false;
        return;
      }

      const frag = document.createDocumentFragment();
      const base = items.length;
      data.items.forEach((it, i) => frag.appendChild(buildCard(it, base + i)));
      grid.appendChild(frag);
      items = items.concat(data.items);
      total = data.total;
      cursor = data.next_cursor;
      done = !cursor;
      loading = false;

      countEl.textContent = items.length + ' / ' + total + ' 个';
      hint.textContent = done ? (items.length === 0 ? '还没有文件，先去上传吧。' : '已经全部加载完。') : '';
    }

    async function remove(ids) {
      const res = await fetch('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
        body: JSON.stringify({ ids: ids }),
      });
      if (!res.ok) { alert('删除失败：' + res.status); return; }
      ids.forEach((id) => {
        const el = grid.querySelector('.card[data-id="' + id + '"]');
        if (el) el.remove();
        picked.delete(id);
      });
      items = items.filter((it) => ids.indexOf(it.id) === -1);
      total = Math.max(0, total - ids.length);
      countEl.textContent = items.length + ' / ' + total + ' 个';
      delSel.disabled = picked.size === 0;
    }

    function openBox(index) {
      const it = items[index];
      if (!it) return;
      box.dataset.index = String(index);
      boxImg.src = '/preview/' + it.id;
      boxImg.alt = it.name;
      boxCap.textContent = it.name + ' · ' + human(it.size) + ' · ' + fmt(it.created_at);
      box.hidden = false;
    }

    function step(delta) {
      const i = parseInt(box.dataset.index, 10) + delta;
      if (i < 0 || i >= items.length) return;
      openBox(i);
    }

    function closeBox() { box.hidden = true; boxImg.src = ''; }

    box.querySelector('.close').addEventListener('click', closeBox);
    box.querySelector('.prev').addEventListener('click', () => step(-1));
    box.querySelector('.next').addEventListener('click', () => step(1));
    box.addEventListener('click', (e) => { if (e.target === box) closeBox(); });
    document.addEventListener('keydown', (e) => {
      if (box.hidden) return;
      if (e.key === 'Escape') closeBox();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
    });

    selAll.addEventListener('change', () => {
      grid.querySelectorAll('.card').forEach((card) => {
        const cb = card.querySelector('.pick');
        if (cb.checked !== selAll.checked) cb.click();
      });
    });

    delSel.addEventListener('click', () => {
      const ids = Array.from(picked);
      if (ids.length === 0) return;
      if (confirm('确认删除选中的 ' + ids.length + ' 个文件？')) remove(ids);
    });

    if ('IntersectionObserver' in window) {
      new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) loadMore();
      }, { rootMargin: '600px' }).observe(sentinel);
    } else {
      window.addEventListener('scroll', () => {
        if (window.innerHeight + window.scrollY > document.body.offsetHeight - 600) loadMore();
      });
    }
    loadMore();
  </script>
{% endblock %}
