<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>相册 · 尝试过于频繁</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #f2f3f5;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        color: #1f2329;
      }
      .card {
        width: 340px; max-width: calc(100vw - 32px);
        background: #fff; border-radius: 12px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, .08);
        padding: 34px 28px; text-align: center;
      }
      h1 { font-size: 18px; margin: 0 0 10px; font-weight: 600; }
      p { font-size: 14px; color: #606770; line-height: 1.7; margin: 0 0 6px; }
      .count { font-size: 30px; font-weight: 600; color: #2f6fed; margin: 10px 0 4px; }
      button {
        width: 100%; height: 42px; margin-top: 18px;
        border: 0; border-radius: 8px; cursor: pointer;
        background: #2f6fed; color: #fff; font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>尝试过于频繁</h1>
      <p>同一 IP 登录次数超限，已被临时保护。</p>
      <div class="count"><span id="n">{{ retry_after }}</span> 秒后自动重试</div>
      <p style="font-size:12px;color:#a3a8b0">这不是密码错误——请稍等再试。密码依旧是你的密码。</p>
      <button type="button" onclick="location.reload()">现在重试</button>
    </div>
    <script>
      // 倒计时归零后自动刷新，省得用户盯着秒数干等
      var left = {{ retry_after }};
      var el = document.getElementById('n');
      var t = setInterval(function () {
        if (--left <= 0) { clearInterval(t); location.reload(); return; }
        el.textContent = left;
      }, 1000);
    </script>
  </body>
</html>
